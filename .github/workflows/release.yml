name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    name: Release to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag, GitHub release and the CHANGELOG commit
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
      id-token: write # npm provenance
    outputs:
      published: ${{ steps.release-check.outputs.published }}
      version: ${{ steps.release-check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Version from the commits, CHANGELOG.md, npm publish, release commit, GitHub release.
      # See .releaserc.json (extends super-configs/semantic-release).
      - name: Semantic release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # semantic-release tags the released commit (HEAD); no tag means nothing was published.
      - name: Detect published release
        id: release-check
        run: |
          git fetch --tags --force
          tag="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          if [ -n "$tag" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "Released $tag"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No new release"
          fi

  # Mirror of the npm release. A separate job so a failure here never affects npm,
  # which has already published by the time this runs.
  github-packages:
    name: Publish to GitHub Packages
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The release tag carries the package.json bumped to the released version.
          ref: v${{ needs.release.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@eljijuna'

      - run: npm ci

      - name: Build
        run: npm run build

      # GitHub Packages requires the owner's scope; only this job renames the package.
      - name: Scope the package for GitHub Packages
        run: npm pkg set name=@eljijuna/kiali-api-client

      - name: Publish
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Deploy documentation
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate documentation
        run: npm run docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
